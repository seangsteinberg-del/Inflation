[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "inflation-disaster"
version = "0.1.0"
description = "Inflation disaster probability estimation from options data (Hilscher, Raviv, Reis 2024)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numba>=0.57",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
bloomberg = ["blpapi>=3.19", "xbbg>=0.7"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
